# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Стенд. По образцу examples/mcp-authzen из agentgateway v1.6.0.
# Личность агента: шлюз сам проверяет подпись токена (jwtAuth, strict) и берёт agent из jwt.sub.
# Хеш определения инструмента шлюз не шлёт: адаптер берёт его у MCP-сервера сам.
mcp:
  port: 3000
  policies:
    jwtAuth:
      mode: strict
      issuer: stand-idp
      audiences: [admission-gateway]
      jwks:
        file: stand/idp/jwks.json
    extAuthz:
      conditional:
      - condition: has(mcp.tool)
        host: localhost:9191
        protocol:
          http:
            path: '"/check"'
            addRequestHeaders:
              content-type: '"application/json"'
              :method: '"POST"'
            body: |
              {
                "agent": jwt.sub,
                "tool": {"server": mcp.tool.target, "name": mcp.tool.name},
                "arguments": mcp.tool.arguments
              }
            metadata:
              decision: json(response.body).allow
    authorization:
      rules:
      - require: '!has(mcp.tool) || extauthz.decision == true'
  targets:
  - name: notes
    mcp:
      host: http://localhost:3001/mcp
