# Контроль потока (OpenAPPA) — сокращённая модель.
# Показывает ровно то, чего НЕ видит OPA по вызову: lethal trifecta из трёх звеньев.
# Отправка наружу требует И доверия (trust), И что получатель в аудитории контекста.
#   - чтение приватного тикета сужает аудиторию → внешний адресат отсекается;
#   - чтение недоверенного веба роняет trust → отправка (даже внутренняя) отсекается.
# Оба звена реально потребляются правилом mail/send.
[policy]
version = 2

[[policy.tool]]
name = "mcp/tickets/get_ticket"
delta = { audience = ["ops@corp.internal"] }

[[policy.tool]]
name = "mcp/websearch/query"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "mcp/mail/send"
parameters = { type = "object", properties = { to = { type = "string" } }, required = ["to"] }
requires = { trust = "trusted", audience = { contains = ["$to"] } }
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
