# Контроль потока (OpenAPPA) — сокращённая модель.
# Показывает ровно то, чего НЕ видит OPA по вызову: цепочку «прочитал приватное → отправил наружу».
# Чтение тикета помечает контекст: эти данные можно отдать только внутреннему адресату.
# Отправка почты разрешена, только если получатель входит в аудиторию контекста.
[policy]
version = 2

[[policy.tool]]
name = "mcp/tickets/get_ticket"
delta = { audience = ["ops@corp.internal"] }

[[policy.tool]]
name = "mcp/websearch/query"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "mcp/mail/send"
parameters = { type = "object", properties = { to = { type = "string" } }, required = ["to"] }
requires = { audience = { contains = ["$to"] } }
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
